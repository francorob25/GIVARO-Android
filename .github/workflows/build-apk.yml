
name: Compilar GIVARO APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair projeto
        run: |
          unzip -o GIVARO.zip -d .

      - name: Compilar APK
        run: gradle -p GIVARO-Android assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GIVARO-APK
          path: GIVARO-Android/app/build/outputs/apk/debug/app-debug.apk
